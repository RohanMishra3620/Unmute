<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FDF7F0">
  <title>Unmute · Your reflection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body class="page">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <a class="logo" href="index.html" aria-label="Unmute home">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 34c-1-12 6-20 18-21 1 12-5 21-18 21z" fill="#6E9A55"/><path d="M8 34c5-8 10-13 18-21" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M24 26c0-11 7-18 19-19 0 12-7 19-19 19z" fill="#F6A119"/><path d="M24 26c6-6 11-12 19-19" stroke="#fff" stroke-opacity=".6" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    <span class="the">the</span><span class="mute">unmute</span>
  </a>
  <nav class="nav" aria-label="Main">
    <button class="pill primary" type="button" data-start aria-label="Start Session">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12c0-4-3-6-7-6 0 4 3 6 7 6z"/><path d="M12 14c0-3 2-5 6-5 0 3-2 5-6 5z"/></svg>
      <span class="lbl">Start Session</span>
    </button>
    <a class="pill" href="#" data-report aria-label="View Report">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
      <span class="lbl">View Report</span>
    </a>
    <a class="pill" href="about.html" aria-label="About">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/></svg>
      <span class="lbl">About</span>
    </a>
  </nav>
</header>
<div class="banner" role="img" aria-label="A person resting under a tree and watching the sunset by a lake"></div>
<main id="main" class="content">
  <p id="report-loading" class="meta" role="status">Loading your reflection…</p>
  <p id="report-error" class="notice" role="alert" hidden></p>
</main>
<dialog id="delDialog" aria-labelledby="delTitle">
  <h2 id="delTitle">Delete this session?</h2>
  <p>Your messages and this report will be removed for good. This cannot be undone.</p>
  <div class="acts">
    <button id="delNo" class="btn ghost" type="button">Keep it</button>
    <button id="delYes" class="btn danger-ghost" type="button">Delete</button>
  </div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./js/config.js"></script>
<script src="./js/app.js"></script>
<script src="./js/report.js"></script>
</body>
</html>
